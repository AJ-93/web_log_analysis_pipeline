log4j.rootCategory=ERROR, console

# Console appender
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Application log
log4j.logger.ajay.spark_project.spark.examples=INFO, console, file
log4j.additivity.ajay.spark_project.spark.examples=false

# File appender (explicit path)
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=${spark.yarn.app.container.log.dir}/${logfile.name}.log
log4j.appender.file.ImmediateFlush=true
log4j.appender.file.Append=false
log4j.appender.file.MaxFileSize=500MB
log4j.appender.file.MaxBackupIndex=2
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.conversionPattern=%d{yyyy-MM-dd HH:mm:ss} %p %c{1}: %m%n

# Spark specific loggers
log4j.logger.org.apache.spark.SparkContext=ERROR, console
log4j.logger.org.apache.spark.internal.Logging$class=ERROR, console
log4j.logger.org.apache.spark.deploy.yarn=ERROR, console
log4j.logger.org.apache.spark.sql=ERROR, console
log4j.logger.org.apache.spark.storage=ERROR, console